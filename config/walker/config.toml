# Base copied from /etc/xdg/walker/config.toml (2.17.0).

force_keyboard_focus = false
close_when_open = true
click_to_close = true
as_window = false
single_click_activation = true
selection_wrap = false
global_argument_delimiter = "#"
exact_search_prefix = "'"
theme = "catppuccin-frappe"
disable_mouse = false
debug = false
page_jump_items = 10
hide_quick_activation = true
hide_action_hints = true
hide_action_hints_dmenu = true
hide_return_action = false
keybind_symbols = true
resume_last_query = false
actions_as_menu = false
autoplay_videos = false
ext_background_effect_blur = false

[shell]
exclusive_zone = -1
layer = "overlay"
anchor_top = true
anchor_bottom = true
anchor_left = true
anchor_right = true

[columns]
"symbols" = 3

[placeholders]
"default" = { input = "Search", list = "No Results" }
"clipboard" = { input = "Clipboard history", list = "Nothing copied yet" }

[keybinds]
close = ["Escape"]
next = ["Down", "ctrl n"]
previous = ["Up", "ctrl p"]
left = ["Left"]
right = ["Right"]
down = ["Down", "ctrl n"]
up = ["Up", "ctrl p"]
toggle_exact = ["ctrl e"]
resume_last_query = ["ctrl r"]
quick_activate = ["F1", "F2", "F3", "F4"]
page_down = ["Page_Down"]
page_up = ["Page_Up"]
show_actions = ["alt j"]

[providers]
default = ["desktopapplications", "calc"]
empty = ["desktopapplications"]
ignore_preview = []
max_results = 50

[providers.sets]
# launch with: walker -s dev
dev = { default = ["files", "menus:projects", "menus:tmux"], empty = ["menus:projects"] }

[providers.max_results_provider]
desktopapplications = 15
clipboard = 30

[[providers.prefixes]]
prefix = ";"
provider = "providerlist"

[[providers.prefixes]]
prefix = "/"
provider = "files"

[[providers.prefixes]]
prefix = "."
provider = "symbols"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = ":"
provider = "clipboard"

[[providers.prefixes]]
prefix = "*"
provider = "unicode"

[[providers.prefixes]]
prefix = "~"
provider = "menus:projects"

[[providers.prefixes]]
prefix = "^"
provider = "menus:tmux"

[providers.clipboard]
time_format = "relative"

# Custom menus, merged with the built-in providers
[providers.actions]
"menus:tmux" = [
  { action = "attach", label = "attach", default = true, bind = "Return" },
  { action = "kill", label = "kill", bind = "ctrl d", after = "AsyncReload" },
]

"menus:projects" = [
  { action = "terminal", label = "terminal", default = true, bind = "Return" },
  { action = "editor", label = "nvim", bind = "ctrl Return" },
  { action = "files", label = "dolphin", bind = "ctrl o" },
  { action = "copypath", label = "copy path", bind = "ctrl c" },
]
